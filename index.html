<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Task Manager</title>

<link rel="stylesheet" href="style.css">

<link
    rel="icon"
    type="image/png"
    href="https://play-lh.googleusercontent.com/oE7aUpS05xE1YaHkfK-iFZ35xZ8ksuZDK31HGV857LkMIZqg-nIoAWO6SfnN40t3oFqr4BkLGyLNpo7KOGbsBw"
>

</head>

<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>
                My Tasks
            </h1>

            <p>
                Manage your tasks efficiently
            </p>

        </div>


        <div class="header-actions">

            <button
                id="themeBtn"
                class="header-btn"
                title="Toggle dark mode"
            >
                🌙
            </button>


            <button
                id="exportBtn"
                class="header-btn"
            >
                📤 Export
            </button>


            <label
                for="importInput"
                class="header-btn import-label"
            >
                📥 Import
            </label>


            <input
                type="file"
                id="importInput"
                accept=".json"
                hidden
            >

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <span>
                Total
            </span>

            <strong id="totalCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Active
            </span>

            <strong id="activeCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Completed
            </span>

            <strong id="completedCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Progress
            </span>

            <strong id="progressPercent">
                0%
            </strong>

        </div>

    </div>


    <!-- ADD TASK -->

    <div class="add-task">

        <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
            autocomplete="off"
        >


        <!-- CATEGORY -->

        <select id="categoryInput">

            <option value="Personal">
                👤 Personal
            </option>

            <option value="Work">
                💼 Work
            </option>

            <option value="Study">
                📚 Study
            </option>

            <option value="Shopping">
                🛒 Shopping
            </option>

            <option value="Duties">
                📝 Duties
            </option>

            <option value="Appointments">
                📅 Appointments
            </option>

            <option value="Reminders">
                🔔 Reminders
            </option>

            <option value="Other">
                📌 Other
            </option>

        </select>


        <!-- PRIORITY -->

        <select id="priorityInput">

            <option value="low">
                🟢 Low
            </option>

            <option
                value="medium"
                selected
            >
                🟡 Medium
            </option>

            <option value="high">
                🔴 High
            </option>

        </select>


        <button
            id="addBtn"
            class="add-btn"
        >
            + Add Task
        </button>

    </div>


    <!-- SEARCH / FILTERS -->

    <div class="controls">

        <!-- SEARCH -->

        <div class="search-box">

            🔍

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
                autocomplete="off"
            >

        </div>


        <!-- STATUS FILTER -->

        <select id="filterInput">

            <option value="all">
                All Tasks
            </option>

            <option value="active">
                Active
            </option>

            <option value="completed">
                Completed
            </option>

        </select>


        <!-- CATEGORY FILTER -->

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="Personal">
                👤 Personal
            </option>

            <option value="Work">
                💼 Work
            </option>

            <option value="Study">
                📚 Study
            </option>

            <option value="Shopping">
                🛒 Shopping
            </option>

            <option value="Duties">
                📝 Duties
            </option>

            <option value="Appointments">
                📅 Appointments
            </option>

            <option value="Reminders">
                🔔 Reminders
            </option>

            <option value="Other">
                📌 Other
            </option>

        </select>


        <!-- PRIORITY FILTER -->

        <select id="priorityFilter">

            <option value="all">
                All Priorities
            </option>

            <option value="high">
                🔴 High
            </option>

            <option value="medium">
                🟡 Medium
            </option>

            <option value="low">
                🟢 Low
            </option>

        </select>


        <!-- SORT -->

        <select id="sortInput">

            <option value="newest">
                Newest
            </option>

            <option value="oldest">
                Oldest
            </option>

            <option value="priority">
                Priority
            </option>

            <option value="alphabetical">
                A → Z
            </option>

            <option value="due">
                Due Date
            </option>

        </select>

    </div>


    <!-- PROGRESS -->

    <div class="progress-container">

        <div class="progress-header">

            <span>
                Overall Progress
            </span>

            <span id="progressText">
                0%
            </span>

        </div>


        <div class="progress-bar">

            <div id="progressFill"></div>

        </div>

    </div>


    <!-- TASKS -->

    <ul id="taskList"></ul>


    <!-- EMPTY -->

    <div
        id="emptyMessage"
        class="empty-message"
    >

        <div class="empty-icon">
            📋
        </div>

        <h3>
            No tasks found
        </h3>

        <p>
            Add a task or change your filters.
        </p>

    </div>


    <!-- BOTTOM -->

    <div class="bottom-actions">

        <button
            id="clearCompletedBtn"
            class="bottom-btn clear-btn"
        >
            🗑️ Clear Completed
        </button>


        <button
            id="clearAllBtn"
            class="bottom-btn danger-btn"
        >
            Delete All
        </button>

    </div>

</div>


<!-- TOAST -->

<div id="toastContainer"></div>


<script src="script.js"></script>

</body>

</html>
